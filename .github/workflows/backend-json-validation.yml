name: AgroScan quality gate

on:
  push:
    branches:
      - main
      - fix/agroscan-platform-hardening
    paths:
      - "backend/**"
      - "frontend/**"
      - "devend/**"
      - "repoend/**"
      - "tools/**"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "devend/**"
      - "repoend/**"
      - "tools/**"
      - ".github/workflows/**"
      - "README.md"

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, unit and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check backend JavaScript syntax
        run: |
          find backend -type f -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Run backend unit tests
        run: npm --prefix backend test
      - name: Validate application metadata and configuration
        run: node tools/validate-static.mjs
