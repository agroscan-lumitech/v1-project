<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroScan Developer Profile</title>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="title.png" type="image/png">
<style>
:root{
  --accent:#ffd700;
  --bg-dark:#0b0b0b;
  --text-light:#f4f7f4;
  --card-bg:#1b1b1b;
  --border-radius:12px;
  --shadow-dark:0 8px 20px rgba(0,0,0,0.6);
  --transition:.3s;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}
body{background:var(--bg-dark);color:var(--text-light);line-height:1.6;}

/* Header */
header {
  background:#000;
  padding:1rem 1.5rem;
  font-size:1.8rem;
  font-weight:bold;
  border-bottom:2px solid var(--accent);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.hamburger{font-size:1.5rem;cursor:pointer;color:var(--accent);}

/* Layout */
.container{display:flex;min-height:calc(100vh - 68px);}

/* Sidebar */
.nav-panel{
  width:250px;background:var(--card-bg);padding:20px;
  display:flex;flex-direction:column;transition:transform var(--transition);
  flex-shrink:0;
}
.nav-panel h2{color:var(--accent);margin-bottom:20px;font-size:1.4rem;text-align:center;}
.nav-panel a{
  color:var(--text-light);text-decoration:none;
  padding:12px 10px;margin-bottom:10px;border-radius:var(--border-radius);
  display:block;transition:var(--transition);
}
.nav-panel a:hover{background:var(--accent);color:#000;}
.nav-profile{margin-top:auto;border-top:1px solid #444;padding-top:15px;text-align:center;}
.nav-profile span{display:block;color:#ccc;font-size:0.9rem;margin-bottom:3px;}
.nav-profile:hover span{color:var(--accent);}
#logout-btn{background:#8b780d;padding:10px;border-radius:6px;text-align:center;}

/* Main Content */
.main-content{flex:1;padding:30px 40px;display:flex;flex-direction:column;gap:20px;}

/* ✅ Responsive Sidebar Toggle + Media Queries */
@media(max-width:992px){
  header{text-align:left; padding-left:1rem;}
  .hamburger{display:block;}
  .container{flex-direction:column;}
  .nav-panel{
    position:fixed;
    top:0; left:-260px;
    height:100%; width:250px;
    flex-direction:column;
    z-index:1000;
  }
  .nav-panel.show{transform:translateX(260px);}
}
@media(max-width:768px){
  .profile-card{padding:20px;}
}
@media(max-width:480px){
  .profile-card{padding:15px;}
  .profile-card i{font-size:3rem;}
  .profile-card h2{font-size:1.3rem;}
}
</style>
</head>
<body>

<header>
  🌱 AgroScan<br>Dev-Profile
  <div class="hamburger"><i class="fas fa-bars"></i></div>
</header>

<div class="container">
  <!-- Sidebar -->
  <nav class="nav-panel" id="sidebar">
    <h2>Menu</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="sqlconsole.html">Console</a>
    <a href="database.html">Database</a>
    <a href="control-panel.html">Control Panel</a>
    <a href="logs.html">Logs</a>
    <a href="settings.html">Settings</a>

    <!-- Profile info at bottom -->
    <div class="nav-profile" id="profile-link">
      <span id="profile-name"></span>
      <span id="profile-id"></span>
    </div>
    <a href="#" id="logout-btn">Logout</a>
  </nav>
  <!-- Main Content -->
<div class="main-content">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h2>Controls Table</h2>
    <button id="edit-btn" style="padding:8px 15px; background:var(--accent); color:#000; border:none; border-radius:6px; cursor:pointer;">Edit</button>
  </div>

  <table id="controls-table" style="width:100%; border-collapse:collapse; background:var(--card-bg);">
    <thead>
      <tr style="border-bottom:1px solid #444;">
        <th style="padding:12px; text-align:left;">Function</th>
        <th style="padding:12px; text-align:left;">Value</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows populated dynamically -->
    </tbody>
  </table>
</div>

<script>
const tableBody = document.querySelector("#controls-table tbody");
const editBtn = document.getElementById("edit-btn");
let isEditing = false;
let controlsData = [];

// Fetch controls from server
async function fetchControls() {
  try {
    const res = await fetch("https://agroscan-backend.onrender.com/api/controls");
    controlsData = await res.json();
    renderTable();
  } catch (err) {
    console.error("Failed to fetch controls:", err);
  }
}

// Render table rows
function renderTable() {
  tableBody.innerHTML = "";
  controlsData.forEach(ctrl => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="padding:12px;">${ctrl.function_name}</td>
      <td style="padding:12px;">
        ${isEditing ? `<input type="text" value="${ctrl.value}" data-func="${ctrl.function_name}" style="width:100%; padding:6px; border-radius:4px; border:1px solid #666;">` : ctrl.value}
      </td>
    `;
    tableBody.appendChild(tr);
  });
}

// Enable/Disable editing
editBtn.addEventListener("click", async () => {
  if (!isEditing) {
    isEditing = true;
    editBtn.textContent = "Save";
    renderTable();
  } else {
    // Save changes
    const inputs = tableBody.querySelectorAll("input");
    for (let input of inputs) {
      const func = input.dataset.func;
      const value = input.value;

      try {
        await fetch(`https://agroscan-backend.onrender.com/api/controls/${encodeURIComponent(func)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value })
        });
      } catch (err) {
        console.error(`Failed to update ${func}:`, err);
      }
    }
    isEditing = false;
    editBtn.textContent = "Edit";
    fetchControls(); // Refresh table
  }
});

// Initial load
fetchControls();
</script>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const devUser = JSON.parse(sessionStorage.getItem("devUser"));
  if(!devUser){
    window.location.href = "../login-form.html";
  } else {
    document.getElementById("profile-name").textContent = devUser.name || devUser.email;
    document.getElementById("profile-id").textContent = "ID: " + (devUser.id || "N/A");
  }

  // ✅ Sidebar toggle for mobile
  document.querySelector(".hamburger").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("show");
  });

  // Logout
  document.getElementById("logout-btn").addEventListener("click", e=>{
    e.preventDefault();
    sessionStorage.clear();
    window.location.href = "../login-form.html";
  });
});
</script>

</body>
</html>
