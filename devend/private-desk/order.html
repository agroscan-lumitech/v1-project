<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroScan Developer Profile</title>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="title.png" type="image/png">
<style>
:root{
  --accent:#ffd700;
  --bg-dark:#0b0b0b;
  --text-light:#f4f7f4;
  --card-bg:#1b1b1b;
  --border-radius:12px;
  --shadow-dark:0 8px 20px rgba(0,0,0,0.6);
  --transition:.3s;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}
body{background:var(--bg-dark);color:var(--text-light);line-height:1.6;}

/* Header */
header {
  background:#000;
  padding:1rem 1.5rem;
  font-size:1.8rem;
  font-weight:bold;
  border-bottom:2px solid var(--accent);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.hamburger{font-size:1.5rem;cursor:pointer;color:var(--accent);}

/* Layout */
.container{display:flex;min-height:calc(100vh - 68px);}

/* Sidebar */
.nav-panel{
  width:250px;background:var(--card-bg);padding:20px;
  display:flex;flex-direction:column;transition:transform var(--transition);
  flex-shrink:0;
}
.nav-panel h2{color:var(--accent);margin-bottom:20px;font-size:1.4rem;text-align:center;}
.nav-panel a{
  color:var(--text-light);text-decoration:none;
  padding:12px 10px;margin-bottom:10px;border-radius:var(--border-radius);
  display:block;transition:var(--transition);
}
.nav-panel a:hover{background:var(--accent);color:#000;}
.nav-profile{margin-top:auto;border-top:1px solid #444;padding-top:15px;text-align:center;}
.nav-profile span{display:block;color:#ccc;font-size:0.9rem;margin-bottom:3px;}
.nav-profile:hover span{color:var(--accent);}
#logout-btn{background:#8b780d;padding:10px;border-radius:6px;text-align:center;}

/* Main Content */
.main-content{flex:1;padding:30px 40px;display:flex;flex-direction:column;gap:20px;}

/* Profile Card */
.profile-card{
  background:var(--card-bg);
  border-radius:var(--border-radius);
  box-shadow:var(--shadow-dark);
  padding:30px;
  max-width:600px;
  margin:auto;
  text-align:center;
}
.profile-card i{
  font-size:4rem;
  color:var(--accent);
  margin-bottom:15px;
}
.profile-card h2{margin-bottom:10px;font-size:1.6rem;}
.profile-card p{margin:6px 0;color:#ccc;}
.profile-info{margin-top:20px;text-align:left;}
.profile-info div{
  padding:12px;border-bottom:1px solid #333;
}
.profile-info div span{color:var(--accent);font-weight:bold;margin-right:8px;}

/* ✅ Responsive Sidebar Toggle + Media Queries */
@media(max-width:992px){
  header{text-align:left; padding-left:1rem;}
  .hamburger{display:block;}
  .container{flex-direction:column;}
  .nav-panel{
    position:fixed;
    top:0; left:-260px;
    height:100%; width:250px;
    flex-direction:column;
    z-index:1000;
  }
  .nav-panel.show{transform:translateX(260px);}
}
@media(max-width:768px){
  .profile-card{padding:20px;}
}
@media(max-width:480px){
  .profile-card{padding:15px;}
  .profile-card i{font-size:3rem;}
  .profile-card h2{font-size:1.3rem;}
}
</style>
</head>
<body>

<header>
  🌱 AgroScan<br>Dev-Profile
  <div class="hamburger"><i class="fas fa-bars"></i></div>
</header>

<div class="container">
  <!-- Sidebar -->
  <nav class="nav-panel" id="sidebar">
    <h2>Menu</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="sqlconsole.html">Console</a>
    <a href="database.html">Database</a>
    <a href="control-panel.html">Control Panel</a>
    <a href="logs.html">Logs</a>
    <a href="settings.html">Settings</a>

    <!-- Profile info at bottom -->
    <div class="nav-profile" id="profile-link">
      <span id="profile-name"></span>
      <span id="profile-id"></span>
    </div>
    <a href="#" id="logout-btn">Logout</a>
  </nav>

<main class="main-content">
  <h1>Orders Table</h1>
  <div id="tables-container"></div>
</main>

<script>
async function fetchTablesGUI() {
  const container = document.getElementById("tables-container");
  container.innerHTML = "Loading orders...";

  try {
    // Fetch orders table
    const res = await fetch("https://agroscan-backend.onrender.com/api/dev/tables/orders");
    const data = await res.json();

    if (!data.success) throw new Error(data.error || "Failed to fetch orders");

    container.innerHTML = ""; // clear loading text
    const tableRows = data.table || [];

    // Table container
    const tblContainer = document.createElement("div");
    tblContainer.style.marginBottom = "20px";

    // Table content
    const tableDiv = document.createElement("div");
    tableDiv.style.overflowX = "auto";

    if (tableRows.length === 0) {
      tableDiv.textContent = "No orders found";
    } else {
      const tbl = document.createElement("table");
      tbl.style.width = "100%";
      tbl.style.borderCollapse = "collapse";
      tbl.style.background = "#1b1b1b";

      // Header
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      Object.keys(tableRows[0]).forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        th.style.border = "1px solid #444";
        th.style.padding = "8px";
        th.style.background = "#000";
        th.style.color = "#ffd700";
        headerRow.appendChild(th);
      });
      const editTh = document.createElement("th");
      editTh.textContent = "Edit";
      editTh.style.border = "1px solid #444";
      editTh.style.padding = "8px";
      editTh.style.background = "#000";
      editTh.style.color = "#ffd700";
      headerRow.appendChild(editTh);
      thead.appendChild(headerRow);
      tbl.appendChild(thead);

      // Body
      const tbody = document.createElement("tbody");
      tableRows.forEach((row, index) => {
        const tr = document.createElement("tr");
        Object.values(row).forEach(val => {
          const td = document.createElement("td");
          td.textContent = val ?? "";
          td.style.border = "1px solid #444";
          td.style.padding = "6px";
          td.style.color = "#f4f7f4";
          tr.appendChild(td);
        });

        // Edit button
        const editTd = document.createElement("td");
        editTd.style.border = "1px solid #444";
        editTd.style.padding = "6px";
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.style.background = "#ffd700";
        editBtn.style.color = "#000";
        editBtn.style.border = "none";
        editBtn.style.borderRadius = "6px";
        editBtn.style.padding = "5px 10px";
        editBtn.style.cursor = "pointer";
        editBtn.addEventListener("click", () => editRow(index));
        editTd.appendChild(editBtn);
        tr.appendChild(editTd);

        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      tableDiv.appendChild(tbl);
    }

    tblContainer.appendChild(tableDiv);
    container.appendChild(tblContainer);

  } catch (err) {
    console.error(err);
    container.innerHTML = "Failed to load orders";
  }
}

// Edit row function
function editRow(rowIndex) {
  alert("Edit functionality for row " + (rowIndex + 1) + " triggered. Implement your editing logic here.");
}

fetchTablesGUI();
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
  const devUser = JSON.parse(sessionStorage.getItem("devUser"));
  if(!devUser){
    window.location.href = "../login-form.html";
  } else {
    document.getElementById("profile-name").textContent = devUser.name || devUser.email;
    document.getElementById("profile-id").textContent = "ID: " + (devUser.id || "N/A");
  }

  // ✅ Sidebar toggle for mobile
  document.querySelector(".hamburger").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("show");
  });

  // Logout
  document.getElementById("logout-btn").addEventListener("click", e=>{
    e.preventDefault();
    sessionStorage.clear();
    window.location.href = "../login-form.html";
  });
});

// Fetch orders from backend
async function loadOrders() {
  const res = await fetch('https://agroscan-backend.onrender.com/api/orders');
  const orders = await res.json();
  const tbody = document.querySelector('#orders-table tbody');
  tbody.innerHTML = '';

  orders.forEach(order => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${order.id}</td>
      <td contenteditable="true">${order.customer}</td>
      <td contenteditable="true">${order.product}</td>
      <td contenteditable="true">${order.quantity}</td>
      <td>
        <select>
          <option ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
          <option ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
          <option ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
        </select>
      </td>
      <td><button class="edit-btn" onclick="updateOrder(${order.id}, this)">Save</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Update order
async function updateOrder(id, btn) {
  const row = btn.parentElement.parentElement;
  const customer = row.cells[1].innerText.trim();
  const product = row.cells[2].innerText.trim();
  const quantity = row.cells[3].innerText.trim();
  const status = row.cells[4].querySelector('select').value;

  const res = await fetch(`https://agroscan-backend.onrender.com/api/orders/${id}`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ customer, product, quantity, status })
  });
  const data = await res.json();
  alert(data.message);
}

// Initial load
loadOrders();
</script>

</body>
</html>
