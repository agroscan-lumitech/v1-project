<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroScan Developer Profile</title>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="title.png" type="image/png">
<style>
:root{
  --accent:#ffd700;
  --bg-dark:#0b0b0b;
  --text-light:#f4f7f4;
  --card-bg:#1b1b1b;
  --border-radius:12px;
  --shadow-dark:0 8px 20px rgba(0,0,0,0.6);
  --transition:.3s;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}
body{background:var(--bg-dark);color:var(--text-light);line-height:1.6;}

/* Header */
header {
  background:#000;
  padding:1rem 1.5rem;
  font-size:1.8rem;
  font-weight:bold;
  border-bottom:2px solid var(--accent);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.hamburger{font-size:1.5rem;cursor:pointer;color:var(--accent);}

/* Layout */
.container{display:flex;min-height:calc(100vh - 68px);}

/* Sidebar */
.nav-panel{
  width:250px;background:var(--card-bg);padding:20px;
  display:flex;flex-direction:column;transition:transform var(--transition);
  flex-shrink:0;
}
.nav-panel h2{color:var(--accent);margin-bottom:20px;font-size:1.4rem;text-align:center;}
.nav-panel a{
  color:var(--text-light);text-decoration:none;
  padding:12px 10px;margin-bottom:10px;border-radius:var(--border-radius);
  display:block;transition:var(--transition);
}
.nav-panel a:hover{background:var(--accent);color:#000;}
.nav-profile{margin-top:auto;border-top:1px solid #444;padding-top:15px;text-align:center;}
.nav-profile span{display:block;color:#ccc;font-size:0.9rem;margin-bottom:3px;}
.nav-profile:hover span{color:var(--accent);}
#logout-btn{background:#8b780d;padding:10px;border-radius:6px;text-align:center;}

/* Main Content */
.main-content{flex:1;padding:30px 40px;display:flex;flex-direction:column;gap:20px;}

/* Profile Card */
.profile-card{
  background:var(--card-bg);
  border-radius:var(--border-radius);
  box-shadow:var(--shadow-dark);
  padding:30px;
  max-width:600px;
  margin:auto;
  text-align:center;
}
.profile-card i{
  font-size:4rem;
  color:var(--accent);
  margin-bottom:15px;
}
.profile-card h2{margin-bottom:10px;font-size:1.6rem;}
.profile-card p{margin:6px 0;color:#ccc;}
.profile-info{margin-top:20px;text-align:left;}
.profile-info div{
  padding:12px;border-bottom:1px solid #333;
}
.profile-info div span{color:var(--accent);font-weight:bold;margin-right:8px;}

/* ✅ Responsive Sidebar Toggle + Media Queries */
@media(max-width:992px){
  header{text-align:left; padding-left:1rem;}
  .hamburger{display:block;}
  .container{flex-direction:column;}
  .nav-panel{
    position:fixed;
    top:0; left:-260px;
    height:100%; width:250px;
    flex-direction:column;
    z-index:1000;
  }
  .nav-panel.show{transform:translateX(260px);}
}
@media(max-width:768px){
  .profile-card{padding:20px;}
}
@media(max-width:480px){
  .profile-card{padding:15px;}
  .profile-card i{font-size:3rem;}
  .profile-card h2{font-size:1.3rem;}
}
</style>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ffd700">
<script src="../pwa-register.js" defer></script>
<script src="../config.js"></script>
<script>window.DEV_CONFIG?.requireAuth("../login-form.html");</script>
</head>
<body>

<header>
  🌱 AgroScan<br>Dev-Profile
  <div class="hamburger"><i class="fas fa-bars"></i></div>
</header>

<div class="container">
  <!-- Sidebar -->
  <nav class="nav-panel" id="sidebar">
    <h2>Menu</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="sqlconsole.html">Console</a>
    <a href="database.html">Database</a>
    <a href="control-panel.html">Control Panel</a>
    <a href="logs.html">Logs</a>
    <a href="settings.html">Settings</a>

    <!-- Profile info at bottom -->
    <div class="nav-profile" id="profile-link">
      <span id="profile-name"></span>
      <span id="profile-id"></span>
    </div>
    <a href="#" id="logout-btn">Logout</a>
  </nav>

<main class="main-content">
  <h1>Orders Table</h1>
  <div id="tables-container"></div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const container = document.getElementById("tables-container");
  if (!container) return;
  const statusOptions = ["pending", "processing", "shipped", "delivered", "cancelled"];

  async function loadOrders() {
    container.textContent = "Loading orders…";
    try {
      const response = await DEV_CONFIG.authFetch("/api/orders?limit=100&offset=0");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Unable to load orders");
      const orders = Array.isArray(data.orders) ? data.orders : [];
      container.replaceChildren();
      if (!orders.length) { container.textContent = "No orders found."; return; }

      const wrapper = document.createElement("div");
      wrapper.style.overflowX = "auto";
      const table = document.createElement("table");
      table.style.cssText = "width:100%;border-collapse:collapse;background:#1b1b1b;";
      const columns = ["Order", "Customer", "Phone", "Product", "Qty", "Unit price", "Total", "Status", "Save"];
      const thead = document.createElement("thead");
      const header = document.createElement("tr");
      columns.forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        th.style.cssText = "padding:9px;border:1px solid #444;background:#000;color:#ffd700;";
        header.appendChild(th);
      });
      thead.appendChild(header);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      orders.forEach(order => {
        const row = document.createElement("tr");
        const values = [order.id, order.customer_name, order.customer_phone, order.product_name, order.quantity, order.unit_price, order.item_total];
        values.forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value == null ? "" : String(value);
          cell.style.cssText = "padding:7px;border:1px solid #444;color:#f4f7f4;";
          row.appendChild(cell);
        });
        const statusCell = document.createElement("td");
        statusCell.style.cssText = "padding:7px;border:1px solid #444;";
        const select = document.createElement("select");
        statusOptions.forEach(status => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status[0].toUpperCase() + status.slice(1);
          option.selected = String(order.status || "pending").toLowerCase() === status;
          select.appendChild(option);
        });
        statusCell.appendChild(select);
        row.appendChild(statusCell);

        const actionCell = document.createElement("td");
        actionCell.style.cssText = "padding:7px;border:1px solid #444;";
        const save = document.createElement("button");
        save.type = "button";
        save.textContent = "Save";
        save.addEventListener("click", async () => {
          save.disabled = true;
          try {
            const response = await DEV_CONFIG.authFetch("/api/orders/" + encodeURIComponent(String(order.id)) + "/status", {
              method: "PUT",
              body: JSON.stringify({ status: select.value })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Order update failed");
            save.textContent = "Saved";
          } catch (error) {
            alert(error.message || "Order update failed");
            save.disabled = false;
          }
        });
        actionCell.appendChild(save);
        row.appendChild(actionCell);
        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      wrapper.appendChild(table);
      container.appendChild(wrapper);
      const total = document.createElement("p");
      total.textContent = "Total order line items: " + String(data.total ?? orders.length);
      container.appendChild(total);
    } catch (error) {
      console.error(error);
      container.textContent = error.message || "Failed to load orders.";
    }
  }
  loadOrders();
  document.getElementById("logout-btn")?.addEventListener("click", event => {
    event.preventDefault();
    DEV_CONFIG.logout();
  });
});
</script>
</body>
</html>
