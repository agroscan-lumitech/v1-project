<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroScan Developer Control Panel</title>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="title.png" type="image/png">
<style>
:root{
  --accent:#ffd700;
  --bg-dark:#0b0b0b;
  --text-light:#f4f7f4;
  --card-bg:#1b1b1b;
  --border-radius:12px;
  --shadow-dark:0 8px 20px rgba(0,0,0,0.6);
  --transition:.3s;
}

/* Reset */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}

body{
  background:var(--bg-dark);
  color:var(--text-light);
  line-height:1.6;
}

/* Header */
header {
  background: #000;
  padding: 1rem 1.5rem;
  font-size: 1.8rem;
  font-weight: bold;
  border-bottom: 2px solid var(--accent);
  position: relative;
  display: flex;
  align-items: center;      /* vertically center content */
  justify-content: space-between; /* space between text and hamburger */
}

header .header-text {
  flex: 0 0 65%;           /* left-aligned text takes 65% width */
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Hamburger */
.hamburger {
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--accent);
  z-index: 1001;
}



/* Layout */
.container{
  display:flex;
  min-height:calc(100vh - 68px);
}

/* Side Navigation */
.nav-panel{
  width:250px;
  background:var(--card-bg);
  display:flex;
  flex-direction:column;
  padding:20px;
  transition:transform var(--transition);
  position:relative;
  flex-shrink:0;
}

.nav-panel h2{
  color:var(--accent);
  margin-bottom:20px;
  font-size:1.4rem;
  text-align:center;
}

.nav-panel a{
  color:var(--text-light);
  text-decoration:none;
  padding:12px 10px;
  margin-bottom:10px;
  border-radius:var(--border-radius);
  display:block;
  transition:var(--transition);
}

.nav-panel a:hover{
  background:var(--accent);
  color:#000;
}

/* Profile at bottom of sidebar */
.nav-profile {
  margin-top: auto;
  border-top: 1px solid #444;
  padding-top: 15px;
  cursor: pointer;
  text-align: center; /* center all content */
}

.nav-profile span {
  display: block;
  color: #ccc;
  font-size: 0.9rem;
  margin-bottom: 3px;
  text-align: center; /* ensure span content is centered */
}

.nav-profile:hover span {
  color: var(--accent);
}

/* Main Content */
.main-content{
  flex:1;
  padding:30px 40px;
  display:flex;
  flex-direction:column;
  gap:30px;
}



/* Responsive adjustments */
@media(max-width:992px){
  header{text-align:left; padding-left:1rem;}
  .hamburger{display:block;}

  .container{
    flex-direction:column;
  }
  .nav-panel{
    position:fixed;
    top:0;
    left:-260px;
    height:100%;
    width:250px;
    flex-direction:column;
    z-index:1000;
  }
  .nav-panel.show{
    transform:translateX(260px);
  }
}

@media(max-width:768px){
  .cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
  .operation-card i{font-size:2rem;}
  .operation-card h3{font-size:1.1rem;}
  .operation-card p{font-size:0.85rem;}
}
@media(max-width:480px){
  .cards{grid-template-columns:1fr;gap:12px;}
  .operation-card i{font-size:1.8rem;}
  .operation-card h3{font-size:1rem;}
  .operation-card p{font-size:0.8rem;}
}
#logout-btn
{
    justify-self: content;
    background-color:#8b780d;
}
/* Console Boxes */
.console-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.console-box{
  background:var(--card-bg);
  border-radius:var(--border-radius);
  padding:20px;
  box-shadow:var(--shadow-dark);
  display:flex;
  flex-direction:column;
}
.console-box h3{margin-bottom:10px; color:var(--accent);}
.console-box textarea{
  width:100%;
  height:200px;
  background:#111;
  color:#f4f7f4;
  border-radius:10px;
  border:1px solid #444;
  padding:10px;
  resize:none;
  font-family:monospace;
  font-size:1rem;
  outline:none;
}
.console-box pre{
  background:#111;
  color:#4dff88;
  padding:10px;
  border-radius:10px;
  max-height:400px;
  overflow:auto;
  font-family:monospace;
  flex:1;
}
.run-btn{
  margin-top:10px;
  padding:10px 20px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}
.run-btn:hover{background:#e6c200;}

/* Responsive */
@media(max-width:768px){
  .console-container{grid-template-columns:1fr;}
}
/* Center SQL boxes on mobile */
@media(max-width:768px){
  .console-container{
    grid-template-columns:1fr; /* stack vertically */
    justify-items:center;       /* center horizontally */
  }

  .console-box{
    width: 95%;               /* make boxes narrower for mobile */
    max-width: 500px;         /* optional max width */
  }
}

</style>
<meta name="robots" content="noindex,nofollow"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#ffd700"><script src="../pwa-register.js" defer></script><script src="../config.js"></script><script>window.DEV_CONFIG?.requireAuth("../login-form.html");</script>
</head>
<body>

<header>
  🌱 AgroScan<br>Dev-SQL-Console
  <div class="hamburger"><i class="fas fa-bars"></i></div>
</header>

<div class="container">
  <!-- Side Navigation -->
  <nav class="nav-panel" id="sidebar">
    <h2>Menu</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="sqlconsole.html">Console</a>
    <a href="database.html">Database</a>
    <a href="control-panel.html">Control Panel</a>
    <a href="logs.html">Logs</a>
    <a href="settings.html">Settings</a>

    <!-- Profile info at bottom -->
    <div class="nav-profile" id="profile-link">
      <span id="profile-name"></span>
      <span id="profile-id"></span>
    </div>
    <a href="#" id="logout-btn">Logout</a>
  </nav>

  <!-- Main Content: SQL Console -->
  <div class="main-content">
    <div class="console-container">
      <div class="console-box">
        <h3>SQL Input</h3>
        <textarea id="sql-input" placeholder="Write SQL command here..."></textarea>
        <button class="run-btn" id="run-sql">Run</button>
      </div>
      <div class="console-box">
        <h3>Output</h3>
        <pre id="sql-output">Results will appear here...</pre>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ---------------- Session Check ----------------
  const devUser = DEV_CONFIG.requireAuth("../login-form.html");
  if (!devUser) return;
  const profileNameElem = document.getElementById("profile-name");
  const profileIdElem = document.getElementById("profile-id");
  if (profileNameElem) profileNameElem.textContent = devUser.name || devUser.email;
  if (profileIdElem) profileIdElem.textContent = "ID: " + devUser.id;

  // ---------------- Hamburger Toggle ----------------
  const hamburger = document.querySelector('.hamburger');
  const sidebar = document.getElementById('sidebar');
  hamburger.addEventListener('click', ()=> sidebar.classList.toggle('show'));

  // ---------------- Profile Click ----------------
  const profileLink = document.getElementById('profile-link');
  if(profileLink) profileLink.addEventListener('click', ()=> window.location.href = './profile.html');

  // ---------------- Logout ----------------
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', e=>{
    e.preventDefault();
    DEV_CONFIG.logout();
  });

  // ---------------- SQL Execution ----------------
  async function runSQL() {
    const sqlInputElem = document.getElementById('sql-input');
    const sqlOutputElem = document.getElementById('sql-output');
    const sqlCommand = sqlInputElem.value.trim();
    
    if (!sqlCommand) return;

    sqlOutputElem.textContent = "Running query...";

    try {
      const response = await DEV_CONFIG.authFetch('/api/sql-run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql: sqlCommand })
      });

      const data = await response.json();

      if (data.success) {
        if (Array.isArray(data.result)) {
          sqlOutputElem.textContent = JSON.stringify(data.result, null, 2);
        } else {
          sqlOutputElem.textContent = data.result || "Query executed successfully.";
        }
        sqlInputElem.value = '';
      } else {
        sqlOutputElem.textContent = "Error: " + data.error;
      }
    } catch (error) {
      sqlOutputElem.textContent = "Server unreachable.";
      console.error(error);
    }
  }

  // ---------------- Event Listeners ----------------
  const runBtn = document.getElementById("run-sql");
  const sqlInputElem = document.getElementById("sql-input");
  const sqlOutputElem = document.getElementById("sql-output");
  if (runBtn) {
    runBtn.disabled = true;
    runBtn.textContent = "SQL disabled for GitHub JSON";
    runBtn.title = "The active GitHub JSON document store does not execute SQL.";
  }
  if (sqlInputElem) {
    sqlInputElem.disabled = true;
    sqlInputElem.placeholder = "SQL commands are not supported by the GitHub JSON store.";
  }
  if (sqlOutputElem) {
    sqlOutputElem.textContent = "SQL execution is disabled because AgroScan uses GitHub JSON storage. Use the read-only Database page to inspect permitted data.";
  }

  const sqlInput = document.getElementById('sql-input');
  if(sqlInput){
    sqlInput.addEventListener('keydown', (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        runSQL();
      }
    });
  }
});
</script>



</body>
</html>
