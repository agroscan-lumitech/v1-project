<style>
/* ================= Reset ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}
html, body {
  height: 100%;
  background: #f4f7f4;
  color: #222;
  line-height: 1.6;
  overflow-x: hidden;
}
#active {
  background: #66bb6a;
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
/* ================= Main Chat Container ================= */
main {
  display: flex;
  flex-direction: column;
  margin: 15px 5px 10px 5px; 
  padding: 10px;
  gap: 10px;
  height: calc(88vh - 130px);
}

/* ================= Chat Window ================= */
#chatWindow {
  flex: 1;
  border: 1px solid #ccc;
  border-radius: 8px;
  background-color: #f9f9f9;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

/* Chat content container keeps Load button at top */
#chatContent {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
}

/* ================= Chats Button ================= */
#loadChatsBtn {
  align-self: center;
  background-color: #388e3c;
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 15px;
  cursor: pointer;
  margin-bottom: 10px;
}
#loadChatsBtn:hover { background-color: #1b5e20; }

/* ================= Clear Chats Button ================= */
#clearChatsBtn {
  align-self: center;
  background-color: #d32f2f; /* red for danger */
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 15px;
  cursor: pointer;
  margin-bottom: 10px;
  margin-left: 5px;
}

#clearChatsBtn:hover {
  background-color: #b71c1c;
}

/* Separation between buttons and chat messages */
#chatContent .button-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;             /* space between buttons */
  margin-bottom: 12px;  /* space below buttons */
  margin-top: 10px;
  padding-bottom: 8px;  /* space inside bottom of the group */
  border-bottom: 1px solid #ccc; /* subtle dividing line */
}



/* ================= Messages ================= */
.message {
  padding: 8px 12px;
  border-radius: 20px;
  max-width: 75%;
  word-wrap: break-word;
}

.user {
  background-color: #2e7d32;
  color: white;
  align-self: flex-end;
}

.ai {
  background-color: #dcedc1;
  color: #2e7d32;
  align-self: flex-start;
}

/* ================= Chat Form ================= */
form#chatForm {
  display: flex;
  gap: 5px;
}

input[type="text"] {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
}

button[type="submit"] {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background-color: #2e7d32;
  color: white;
  cursor: pointer;
}

button[type="submit"]:hover {
  background-color: #1b5e20;
}

/* ================= Scrollbar ================= */
#chatWindow::-webkit-scrollbar {
  width: 8px;
}
#chatWindow::-webkit-scrollbar-thumb {
  background-color: #2e7d32;
  border-radius: 4px;
}
#chatWindow::-webkit-scrollbar-track {
  background: #f1f1f1;
}

/* ================= Responsive ================= */
@media(max-width:1024px){
  main { margin-top: 15px; height: calc(88vh - 130px); }
}
@media(max-width:768px){
  main { margin-top: 15px; height: calc(88vh - 130px); }
}
@media(max-width:480px){
  main { margin-top: 15px; height: calc(88vh - 130px); }
}

/* Chat adjustments for tablets */
@media(max-width:1024px){
  main { margin: 10px; height: calc(85vh - 120px); }
  #chatWindow { font-size: 14px; }
  main {height: calc(91vh - 130px);}
}

/* Chat adjustments for mobile */
@media(max-width:768px){
  main { margin: 5px; height: calc(80vh - 100px); }
  #chatContent { gap: 6px; }
  .message { max-width: 90%; padding: 6px 10px; font-size: 14px; }
  form#chatForm { flex-direction: column; gap: 5px; }
  input[type="text"] { width: 100%; border-radius: 15px; }
  button[type="submit"] { width: 100%; border-radius: 15px; }
  #loadChatsBtn, #clearChatsBtn { width: 100%; margin: 5px 0; }
   main {height: calc(94vh - 130px);}
}
@media(max-width:480px){
  .message { font-size: 13px; padding: 5px 8px; }
  #chatWindow { height: calc(75vh - 90px); }
  button[type="submit"] { padding: 8px 0; }
   main {height: calc(95vh - 130px);}
}

</style>
  <script src="/config.js"></script>

<meta name="description" content="Private AI chat interface for AgroScan users.">

</head>

<body>

<!-- ================= Header ================= -->
<div class="no-adjust">
<header>

</header>

<div class="top-bar">
  <a href="home.html" class="top-btn" id="n-active">Home</a>
  <a href="soil-test.html" class="top-btn" id="n-active">Soil Test</a>

<!-- ================= Side Panel ================= -->
<div class="side-panel">
  <div class="close-btn" onclick="toggleSidePanel()">×</div>
  <ul class="side-menu">
    <li><a href="home.html">Home</a></li>
    <li>

      <ul class="side-submenu">
        <a href="./agropedia/index.agropedia.html">AgroPedia</a>
        <a href="./agroshop/index.agroshop.html">AgroShop</a>
        <a href="./agroawareness/index.agroawareness.html">AgroAwareness</a>
        <a href="./agroscheme/index.agroscheme.html">AgroScheme</a>
      </ul>
    </li>
    <li>
      <button class="side-toggle">Account</button>
      <ul class="side-submenu">
        <li><a href="profile.html">Profile</a></li>
        <li><a href="login-form.html">Login</a></li>
        <li><a href="#" id="logoutLinkMobile" style="display:none;">Logout</a></li>
      </ul>
    </li>
  </ul>


  <div class="panel-user-info">
    <img src="img/profile-logo.jpg" class="profile-logo-slide" alt="Profile">
    <p><strong>Name:</strong> Guest User</p>
    <p><strong>Username:</strong> @guest</p>
  </div>
</div>

<!-- ================= Main Content ================= -->
<main>
  <div id="chatWindow">
  <div id="chatContent">
   <div class="button-group">
    <button id="loadChatsBtn">Load Previous Chats</button>
    <button id="clearChatsBtn">Clear All Chats</button>
   </div>
  <!-- Messages inserted here -->
 </div>
 </div>

  <form id="chatForm">
    <input type="text" id="userMessage" placeholder="Type your message..." required>
    <button type="submit">Send</button>
  </form>
</main>



<script>
/* ================= Side Panel ================= */
function toggleSidePanel(){
  document.querySelector('.side-panel').classList.toggle('open');
}
window.addEventListener('click', function(e){
  const panel = document.querySelector('.side-panel');
  const hamburger = document.querySelector('.hamburger');
  if(!panel.contains(e.target) && !hamburger.contains(e.target)){
    panel.classList.remove('open');
  }
});
document.querySelectorAll('.side-toggle').forEach(toggle => {
  toggle.addEventListener('click', function(){
    const submenu = this.nextElementSibling;
    document.querySelectorAll('.side-submenu').forEach(sm => {
      if(sm !== submenu) sm.style.maxHeight = null;
    });
    submenu.style.maxHeight = submenu.style.maxHeight ? null : submenu.scrollHeight + "px";
  });
});

/* ================= User Info ================= */
let currentUser = AGRO.getUser() || { username: 'Guest' };
function showUserInfo(user) {
  const fullName = String(user?.fullName || user?.name || "Guest User");
  const username = user?.username ? "@" + String(user.username) : "@guest";
  const fullNameEl = document.getElementById("full-name");
  const usernameEl = document.getElementById("username-display");
  const welcomeEl = document.getElementById("user-name-welcome");
  const logoutLinks = document.querySelectorAll("#logoutLink, #logoutLinkMobile");
  if (fullNameEl) fullNameEl.textContent = fullName;
  if (usernameEl) usernameEl.textContent = username;
  if (welcomeEl) welcomeEl.textContent = fullName;
  logoutLinks.forEach(link => { link.style.display = user ? "block" : "none"; });
  const panelInfo = document.querySelector(".panel-user-info");
  if (panelInfo) {
    const image = document.createElement("img");
    image.src = "img/profile-logo.jpg";
    image.alt = "Profile";
    image.className = "profile-logo-slide";
    const name = document.createElement("p");
    const nameLabel = document.createElement("strong");
    nameLabel.textContent = "Name: ";
    name.append(nameLabel, document.createTextNode(fullName));
    const handle = document.createElement("p");
    const handleLabel = document.createElement("strong");
    handleLabel.textContent = "Username: ";
    handle.append(handleLabel, document.createTextNode(username));
    panelInfo.replaceChildren(image, name, handle);
  }
}
showUserInfo(currentUser);

/* ================= Chat ================= */
const chatWindow = document.getElementById('chatWindow');
const chatContent = document.getElementById('chatContent');
const chatForm = document.getElementById('chatForm');
const userMessageInput = document.getElementById('userMessage');

const loadedMessageIds = new Set(); // track message IDs to prevent duplicates

function addMessage(msgObj){
  if(loadedMessageIds.has(msgObj.id)) return; // skip duplicates
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${msgObj.sender}`;
  msgDiv.textContent = msgObj.message;
  chatContent.appendChild(msgDiv);
  loadedMessageIds.add(msgObj.id);
  chatWindow.scrollTop = chatWindow.scrollHeight; // scroll to bottom
}

/* ================= Load Entire Chat ================= */
async function loadAllChats(){
  if(currentUser.username === "Guest") return;

  try {
    const res = await fetch(AGRO.api('chatHistory', { userId: currentUser.userId }) + '?limit=10000&offset=0');
    if(!res.ok) throw new Error("Failed to fetch chat history");

    const data = await res.json();
    if(data.history && data.history.length > 0){
      // Append in natural order: oldest at top, newest at bottom
      data.history.forEach(msg => {
        addMessage({
          id: msg.chat_id || 'msg-' + Date.now() + Math.random(),
          message: msg.message,
          sender: msg.sender
        });
      });
    }
  } catch(err){
    console.error(err);
    addMessage({id: 'fail-'+Date.now(), message: "Failed to load chat history.", sender: 'ai'});
  }
}
loadAllChats();


/* ================= Delete Entire Chat ================= */
const clearChatsBtn = document.getElementById('clearChatsBtn');

clearChatsBtn.addEventListener('click', async () => {
  if(currentUser.username === "Guest") {
    alert("Please log in to clear chats.");
    return;
  }

  if(!confirm("Are you sure you want to clear all chats?")) return;

  try {
    const res = await fetch(AGRO.api('clearChat', { userId: currentUser.userId }), {
      method: 'DELETE'
    });

    const data = await res.json();
    if(data.success){
      // Remove all chat messages from UI
      chatContent.querySelectorAll('.message').forEach(msg => msg.remove());
      alert("All chats cleared successfully.");
    } else {
      alert("Failed to clear chats.");
    }
  } catch(err){
    console.error(err);
    alert("Error clearing chats.");
  }
});


/* ================= Send New Message ================= */
chatForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const message = userMessageInput.value.trim();
  if(!message) return;

  const userMsgId = 'user-' + Date.now();
  addMessage({id: userMsgId, message, sender: 'user'});
  userMessageInput.value = '';

  if(currentUser.username === "Guest"){
    addMessage({id: 'ai-'+Date.now(), message: "Please log in to chat with AI.", sender: 'ai'});
    return;
  }

  try {
    const res = await fetch(AGRO.api('chat'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message, userId: currentUser.userId })
    });
    const data = await res.json();
    addMessage({id: 'ai-'+Date.now(), message: data.aiResponse, sender: 'ai'});
  } catch(err){
    console.error(err);
    addMessage({id: 'ai-'+Date.now(), message: "Error communicating with server.", sender: 'ai'});
  }
});

/* Logout functionality */
/* Logout functionality */
document.querySelectorAll("#logoutLink, #logoutLinkMobile").forEach(link => {
  link.addEventListener("click", async event => {
    event.preventDefault();
    await AGRO.clearUser();
    window.location.href = "index.html";
  });
});


</script>


</body>
