# Farmer-facing AgroScan Netlify site
[build]
  base = "frontend"
  publish = "."

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonicalize the explicit index document to the site root.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The donation page currently has no configured donation options; keep it out of search until complete.
[[headers]]
  for = "/donate.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/contributors.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
