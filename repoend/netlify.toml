# Public AgroScan project / updates Netlify site
[build]
  base = "repoend"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonicalize the explicit index document to the site root.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The legacy launch countdown is historical and should not appear in search.
[[headers]]
  for = "/stat.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/contributors.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
